# /etc/nginx/sites-available/inventory-web
# The React web app: static files from `npm run build`. Replace app.example.com.
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    root /var/www/inventory-web/dist;

    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Built files have content hashes in their names, so they can be cached for long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a page of the app.
    location / {
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

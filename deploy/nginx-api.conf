# /etc/nginx/sites-available/inventory-api
# The API. Replace api.example.com; certbot adds the HTTPS (443) part.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    root /var/www/inventory-api/public;

    index index.php;
    charset utf-8;

    # Product photos and the logo are up to 2 MB; leave room for the form encoding.
    client_max_body_size 3m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded images (public/storage -> storage/app/public).
    location /storage/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve .env, .git or other hidden files.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
